name: post

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them, so each run only checks
    # what is due; the posting times are post_at in config.toml (Berlin time).
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "'due' = post what the schedule says is due; a platform = post to it now"
        type: choice
        options: [due, bluesky, mastodon, linkedin]
        default: due
      dry_run:
        description: Preview only (posts nothing, saves nothing)
        type: boolean
        default: true

permissions:
  contents: write  # to commit state/<platform>.json

# one run at a time, so two runs never post or push the state files simultaneously
concurrency:
  group: post-publisher
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Publish
        env:
          PLATFORM: ${{ inputs.platform || 'due' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          LINKEDIN_TOKEN_EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}
        run: |
          if [ "$PLATFORM" = "due" ]; then target="--due"; else target="--platform $PLATFORM"; fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m publisher $target --dry-run -n 3
          else
            python -m publisher $target
          fi

      # also after a failure, so the platforms that did post keep their progress
      - name: Save rotation state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          platforms=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd, -)
          git commit -m "state: $platforms posted"
          git pull --rebase
          git push
