# How often each content type is picked, relative to the others (0 = never).
[weights]
article = 45
medium = 10
quote = 25
book = 20
ad = 0
external = 0

# UTM parameters added to links on these domains, so codersite.dev analytics
# can tell which platform a visitor came from. Amazon short links are left untouched.
[utm]
domains = ["codersite.dev"]
medium = "social"
campaign = "post-publisher"

[schedule]
timezone = "Europe/Berlin"  # post_at times below are in this timezone

# post_at:      local times to post; the workflow checks every 30 minutes and posts
#               once per time that has passed since the platform's last post
# days:         only on these days (omit = every day)
# max_len:      character limit of a post
# link_in_text: true = URL is part of the text; false = sent separately (link card)
# url_len:      characters the platform counts for any URL (omit = real length)
# max_tags:     how many hashtags to keep
# text_only:    only posts without a link are eligible
# types:        only these content types are eligible (omit = all types)
[platforms.bluesky]
post_at = ["02:10", "06:10", "10:10", "14:10", "18:10", "22:10"]
max_len = 300
link_in_text = false
max_tags = 3

[platforms.mastodon]
post_at = ["09:40", "18:40"]
max_len = 500
link_in_text = true
url_len = 23
max_tags = 4

[platforms.linkedin]
post_at = ["09:10"]
days = ["mon", "tue", "wed", "thu", "fri"]
max_len = 2800  # API limit is 3000; leaves room for escaping
link_in_text = false
max_tags = 3
api_version = "202609"  # LinkedIn-Version header; each version is supported ~1 year
types = ["article"]  # only these content types are posted here

[platforms.facebook]
max_len = 5000
link_in_text = false
max_tags = 2

[platforms.x]
max_len = 280
link_in_text = true
url_len = 23
max_tags = 2
text_only = true
